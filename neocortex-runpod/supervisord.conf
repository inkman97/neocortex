[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gpu_server]
command=python gpu_server.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/gpu_server.err.log
stdout_logfile=/var/log/gpu_server.out.log
environment=PORT="8000"

[program:discovery_server]
command=python run_discovery.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/discovery_server.err.log
stdout_logfile=/var/log/discovery_server.out.log
environment=PORT="8001"